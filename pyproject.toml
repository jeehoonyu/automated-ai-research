[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-ai-research"
version = "0.1.0"
description = "Local-first, evidence-first research artifacts and validation for host coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Automated AI Research contributors" }]
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.23,<5",
  "jinja2>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "PyYAML>=6,<7",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6,<7",
]

[project.scripts]
research = "research.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/automated-ai-research/schemas/v1" = ["schemas/v1/*.schema.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
