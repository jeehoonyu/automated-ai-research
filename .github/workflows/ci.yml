name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/research
      - run: python benchmark/generate_fixtures.py
      - run: git diff --exit-code -- benchmark/fixtures
      - run: pytest --cov=research --cov-report=term-missing
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python tests/packaging_smoke.py
      - run: research --help
