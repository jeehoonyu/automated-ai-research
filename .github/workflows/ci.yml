name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux and macOS are the primary targets (spec 6); Windows is supported where the PDF
    # dependencies allow, so it runs here too rather than being assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Schemas are regenerated, not hand-edited
        # tools/generate_schemas.py is the author of schemas/v1. If a schema was edited by hand
        # the next regeneration would silently revert it, so the tree must already be clean.
        run: |
          python tools/generate_schemas.py
          git diff --exit-code schemas/
      - run: ruff check src tests
      - run: mypy src/research

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/research --version
          /tmp/clean/bin/research init /tmp/ws
          test -f /tmp/ws/workflow/canonical-workflow.md
